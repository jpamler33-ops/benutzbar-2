name: COASTFINDER Mobile WebKit 10x
on:
  pull_request:
    paths:
      - '*.js'
      - '*.html'
      - '*.css'
      - 'tests/**'
      - '.github/workflows/webkit-mobile.yml'
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.html'
      - '*.css'
      - 'tests/**'
      - '.github/workflows/webkit-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Container-based runs must not queue behind legacy apt jobs stalled during migration.
  group: coastfinder-webkit-container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile-webkit:
    runs-on: ubuntu-24.04
    # Official pinned Playwright image contains matching browser + OS dependencies.
    # Avoid unreliable apt downloads on every PR.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25
    steps:
      - name: Checkout existing COASTFINDER
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matching Playwright JS package (browsers provided by container)
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Ten real WebKit engine iPhone-sized mobile browser cycles
        run: node tests/webkit_mobile_10x.js
      - name: Keep BLACKTIDE mobile visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blacktide-webkit-layouts
          path: qa-screenshots/blacktide-webkit-*.png
          if-no-files-found: ignore
